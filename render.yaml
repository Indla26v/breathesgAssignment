services:
  - type: web
    name: breathe-esg-api
    env: python
    buildCommand: "pip install -r requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: breathe-esg-redis
          property: connectionString

  - type: worker
    name: breathe-esg-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config.celery worker --loglevel=info --concurrency=2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          type: web
          name: breathe-esg-api
          property: envVar:SECRET_KEY
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: breathe-esg-redis
          property: connectionString

  - type: redis
    name: breathe-esg-redis
    ipAllowList: []


databases:
  - name: breathe-esg-db
    plan: free

