version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: breathe-esg-db
    environment:
      POSTGRES_DB: breathe_esg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: breathe-esg-redis
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breathe-esg-web
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/breathe_esg
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_1234
      - PYTHONPATH=backend
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breathe-esg-worker
    command: celery -A config.celery worker --loglevel=info
    volumes:
      - .:/code
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/breathe_esg
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_1234
      - PYTHONPATH=backend
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
